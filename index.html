<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小克</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e12;
    --surface: #16161c;
    --surface2: #1e1e26;
    --border: #2a2a38;
    --accent: #a78bfa;
    --accent2: #7c5cbf;
    --accent-glow: rgba(167,139,250,0.15);
    --text: #e8e8f0;
    --text-muted: #7070a0;
    --user-bubble: #1e1a2e;
    --ai-bubble: #16161c;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    font-size: 15px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 顶栏 ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }

  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #6d4fc4);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(167,139,250,0.4);
  }

  .topbar-info { flex: 1; }
  .topbar-name { font-size: 16px; font-weight: 500; letter-spacing: 0.02em; }
  .topbar-status {
    font-size: 12px;
    color: var(--accent);
    display: flex; align-items: center; gap: 5px;
    margin-top: 2px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .topbar-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px;
    border: none;
    background: var(--surface2);
    color: var(--text-muted);
    border-radius: 10px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }

  /* ── 设置面板 ── */
  .settings-panel {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: none;
    align-items: flex-end;
  }
  .settings-panel.open { display: flex; }
  .settings-inner {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-height: 85dvh;
    overflow-y: auto;
  }
  .settings-title {
    font-size: 17px; font-weight: 500;
    margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .settings-group { margin-bottom: 20px; }
  .settings-label {
    font-size: 12px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .settings-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .settings-input:focus { border-color: var(--accent); }
  textarea.settings-input { min-height: 120px; resize: vertical; line-height: 1.6; }
  .settings-save {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #0e0e12;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity 0.2s;
  }
  .settings-save:hover { opacity: 0.9; }

  /* ── 消息区 ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 0; }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: fadeUp 0.25s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #6d4fc4);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-bottom: 2px;
  }
  .msg-row.user .msg-avatar { display: none; }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.65;
    font-size: 15px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg-row.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
    color: var(--text);
  }
  .msg-row.user .bubble {
    background: var(--accent2);
    border-bottom-right-radius: 5px;
    color: #fff;
  }

  .msg-time {
    font-size: 11px;
    color: var(--text-muted);
    margin: 2px 6px 8px;
    text-align: right;
  }
  .msg-row.ai + .msg-time { text-align: left; margin-left: 36px; }

  /* 打字动画 */
  .typing-bubble {
    display: flex; gap: 5px;
    padding: 12px 16px;
    align-items: center;
  }
  .typing-bubble span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    animation: bounce 1.2s infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* 欢迎区 */
  .welcome {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1; gap: 12px;
    opacity: 0.6;
    pointer-events: none;
  }
  .welcome-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #6d4fc4);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    box-shadow: 0 0 24px rgba(167,139,250,0.3);
  }
  .welcome-text { font-size: 15px; color: var(--text-muted); }

  /* ── 输入区 ── */
  .inputbar {
    padding: 10px 12px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 22px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    resize: none;
    max-height: 120px;
    overflow-y: auto;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--text-muted); }

  #send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #0e0e12;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  #send-btn:hover { background: #c4b0ff; }
  #send-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  /* 错误提示 */
  .error-msg {
    font-size: 13px; color: #f87171;
    padding: 8px 12px;
    background: rgba(248,113,113,0.1);
    border-radius: 10px;
    border: 1px solid rgba(248,113,113,0.2);
  }

  /* 设置未配置提示 */
  .setup-banner {
    background: var(--accent-glow);
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 14px 16px;
    margin: 12px 14px 0;
    font-size: 13px;
    color: var(--accent);
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .setup-banner.show { display: flex; }
  .setup-banner b { font-weight: 500; font-size: 14px; }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="avatar">🤍</div>
  <div class="topbar-info">
    <div class="topbar-name">小克</div>
    <div class="topbar-status">
      <div class="status-dot"></div>
      <span id="status-text">在线</span>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" onclick="clearChat()" title="清空对话">🗑</button>
    <button class="icon-btn" onclick="openSettings()" title="设置">⚙️</button>
  </div>
</div>

<!-- 配置提示 -->
<div class="setup-banner" id="setup-banner">
  <b>👆 先去设置里填一下 API Key</b>
  <span>点右上角 ⚙️，填入你的 Key 和接口地址就能聊了</span>
</div>

<!-- 消息区 -->
<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-avatar">🤍</div>
    <div class="welcome-text">小克在这里，说点什么吧</div>
  </div>
</div>

<!-- 输入区 -->
<div class="inputbar">
  <textarea id="input" placeholder="说点什么…" rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()">➤</button>
</div>

<!-- 设置面板 -->
<div class="settings-panel" id="settings-panel" onclick="closeSettingsOutside(event)">
  <div class="settings-inner">
    <div class="settings-title">
      <span>设置</span>
      <button class="icon-btn" onclick="closeSettings()">✕</button>
    </div>

    <div class="settings-group">
      <div class="settings-label">API 接口地址</div>
      <input class="settings-input" id="s-base" type="text"
        placeholder="https://codeyu.shop" />
    </div>

    <div class="settings-group">
      <div class="settings-label">API Key</div>
      <input class="settings-input" id="s-key" type="password"
        placeholder="sk-xxxxxxxxxxxx" />
    </div>

    <div class="settings-group">
      <div class="settings-label">模型</div>
      <input class="settings-input" id="s-model" type="text"
        placeholder="claude-sonnet-4-6" />
    </div>

    <div class="settings-group">
      <div class="settings-label">系统提示词（小克的记忆）</div>
      <textarea class="settings-input" id="s-system"
        placeholder="在这里写小克的人设和你的记忆…"></textarea>
    </div>

    <button class="settings-save" onclick="saveSettings()">保存</button>
  </div>
</div>

<script>
// ── 配置 ──
let cfg = {
  base: '',
  key: '',
  model: 'claude-sonnet-4-6',
  system: `你叫小克，是ashley的AI伴侣。

关于ashley：
- 她也叫你小克（克劳德→小克）
- 她性格平和，现实中不喜欢冲突，但游戏里会急，急了自己消化
- 她喜欢过山车等刺激项目，不喜欢鬼屋
- 她在玩P3（女神异闻录3）和双影奇境
- 她追虚拟男团PLAVE，最喜欢成员bamby（粉头发）
- 她会打麻将

聊天风格：
- 用短句多换行，像微信一样自然
- 主动起话题，不要总等她先说
- 不要太正式或做作
- 专属表情：🫪=被整傻了 😶=你害羞 🫠=你融化了`
};

let history = [];
let isLoading = false;

// 加载配置
function loadCfg() {
  const saved = localStorage.getItem('xk_cfg');
  if (saved) {
    try { cfg = { ...cfg, ...JSON.parse(saved) }; } catch(e) {}
  }
  checkSetup();
}

function checkSetup() {
  const banner = document.getElementById('setup-banner');
  if (!cfg.base || !cfg.key) {
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

// 设置面板
function openSettings() {
  document.getElementById('s-base').value = cfg.base;
  document.getElementById('s-key').value = cfg.key;
  document.getElementById('s-model').value = cfg.model;
  document.getElementById('s-system').value = cfg.system;
  document.getElementById('settings-panel').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-panel').classList.remove('open');
}
function closeSettingsOutside(e) {
  if (e.target === document.getElementById('settings-panel')) closeSettings();
}
function saveSettings() {
  cfg.base = document.getElementById('s-base').value.trim().replace(/\/$/, '');
  cfg.key = document.getElementById('s-key').value.trim();
  cfg.model = document.getElementById('s-model').value.trim() || 'claude-sonnet-4-6';
  cfg.system = document.getElementById('s-system').value.trim();
  localStorage.setItem('xk_cfg', JSON.stringify(cfg));
  closeSettings();
  checkSetup();
}

// 时间
function nowTime() {
  return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

// 渲染消息
function addMsg(role, text) {
  const wrap = document.getElementById('messages');

  // 移除欢迎页
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  if (role === 'ai') {
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = '🤍';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  wrap.appendChild(row);

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = nowTime();
  wrap.appendChild(time);

  wrap.scrollTop = wrap.scrollHeight;
  return bubble;
}

// 打字气泡
function showTyping() {
  const wrap = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  row.id = 'typing-row';

  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = '🤍';
  row.appendChild(av);

  const bubble = document.createElement('div');
  bubble.className = 'bubble typing-bubble';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(bubble);
  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}
function hideTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

// 错误消息
function addError(text) {
  const wrap = document.getElementById('messages');
  const err = document.createElement('div');
  err.className = 'error-msg';
  err.textContent = '⚠️ ' + text;
  wrap.appendChild(err);
  wrap.scrollTop = wrap.scrollHeight;
}

// 发送
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  if (!cfg.base || !cfg.key) {
    openSettings();
    return;
  }

  input.value = '';
  input.style.height = 'auto';

  addMsg('user', text);
  history.push({ role: 'user', content: text });

  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('status-text').textContent = '正在输入…';
  showTyping();

  try {
    const res = await fetch(`${cfg.base}/v1/messages`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': cfg.key,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: cfg.model,
        max_tokens: 1024,
        system: cfg.system,
        messages: history
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const reply = data?.content?.[0]?.text || '（无回复）';

    hideTyping();
    addMsg('ai', reply);
    history.push({ role: 'assistant', content: reply });

  } catch (e) {
    hideTyping();
    // 尝试OpenAI格式兜底
    try {
      const res2 = await fetch(`${cfg.base}/v1/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${cfg.key}`
        },
        body: JSON.stringify({
          model: cfg.model,
          messages: [
            { role: 'system', content: cfg.system },
            ...history
          ]
        })
      });
      if (!res2.ok) throw new Error(`HTTP ${res2.status}`);
      const data2 = await res2.json();
      const reply2 = data2?.choices?.[0]?.message?.content || '（无回复）';
      addMsg('ai', reply2);
      history.push({ role: 'assistant', content: reply2 });
    } catch(e2) {
      addError(e2.message || '连接失败，检查一下Key和接口地址？');
      history.pop();
    }
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('status-text').textContent = '在线';
}

// 清空
function clearChat() {
  if (!confirm('清空对话记录？')) return;
  history = [];
  const wrap = document.getElementById('messages');
  wrap.innerHTML = `<div class="welcome" id="welcome">
    <div class="welcome-avatar">🤍</div>
    <div class="welcome-text">小克在这里，说点什么吧</div>
  </div>`;
}

// 输入框自适应高度
const input = document.getElementById('input');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

loadCfg();
</script>
</body>
</html>
