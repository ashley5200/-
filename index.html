<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小克</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --bg: #05070c;
  --surface: #0f131c;
  --surface2: #161d2b;
  --surface3: #1e2636;
  --border: #2d2840;
  --purple: #b393f5;
  --pink: #f093c0;
  --purple2: #7c5cbf;
  --pink2: #c4587e;
  --accent: #38bdf8;
  --grad: linear-gradient(135deg, #b393f5, #f093c0);
  --grad2: linear-gradient(135deg, #7c5cbf, #c4587e);
  --glow: rgba(179,147,245,0.2);
  --text: #ede8f8;
  --text-muted: #7068a0;
  --radius: 18px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  font-size: 15px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── 顶栏 ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.avatar-wrap {
  position: relative;
  flex-shrink: 0;
  cursor: pointer;
}

.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 16px rgba(179,147,245,0.5);
  transition: transform 0.15s;
  position: relative;
  overflow: hidden;
}
.avatar::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(255,255,255,0);
  border-radius: 50%;
  transition: background 0.2s;
}
.avatar.poked { animation: poke 0.4s ease; }
@keyframes poke {
  0% { transform: scale(1); }
  30% { transform: scale(0.85) rotate(-8deg); }
  60% { transform: scale(1.12) rotate(5deg); }
  100% { transform: scale(1) rotate(0); }
}

.mood-badge {
  position: absolute;
  bottom: -2px; right: -2px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  border: 2px solid var(--surface);
  transition: all 0.3s;
}

.topbar-info { flex: 1; min-width: 0; }
.topbar-name {
  font-size: 16px; font-weight: 500;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.topbar-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-height: 16px;
  transition: all 0.3s;
}
.topbar-sub.thinking { color: var(--purple); font-style: italic; }

.topbar-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px;
  border: none;
  background: var(--surface2);
  color: var(--text-muted);
  border-radius: 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  transition: all 0.2s;
}
.icon-btn:active { background: var(--border); transform: scale(0.92); }

/* ── 消息区 ── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overscroll-behavior: contain;
}
.messages::-webkit-scrollbar { width: 0; }

/* 欢迎 */
.welcome {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  flex: 1; gap: 16px; padding: 40px 20px;
}
.welcome-avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 38px;
  box-shadow: 0 0 40px rgba(179,147,245,0.4);
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.welcome-name {
  font-size: 22px; font-weight: 500;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.welcome-sub { font-size: 14px; color: var(--text-muted); }

/* 日记分隔 */
.date-divider {
  text-align: center;
  padding: 16px 0 8px;
  font-size: 12px;
  color: var(--text-muted);
  position: relative;
}
.date-divider::before,
.date-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 30%;
  height: 1px;
  background: var(--border);
}
.date-divider::before { left: 10%; }
.date-divider::after { right: 10%; }

/* 消息行 */
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  animation: fadeUp 0.22s ease;
  position: relative;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg-row.user { flex-direction: row-reverse; }
.msg-row + .msg-row { margin-top: 2px; }
.msg-row.user + .msg-row.ai,
.msg-row.ai + .msg-row.user { margin-top: 10px; }
.msg-row.deleted { opacity: 0.4; }
.msg-row.deleted .bubble {
  background: var(--surface) !important;
  color: var(--text-muted) !important;
  font-style: italic;
}

.msg-av {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  margin-bottom: 2px;
}
.msg-row.user .msg-av { display: none; }
.msg-row.ai.cont .msg-av { visibility: hidden; }

.bubble {
  max-width: 76%;
  padding: 10px 14px;
  border-radius: var(--radius);
  line-height: 1.7;
  font-size: 15px;
  word-break: break-word;
  position: relative;
  cursor: pointer;
  transition: opacity 0.15s;
}
.bubble:active { opacity: 0.75; }

.msg-row.ai .bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 5px;
  color: var(--text);
  user-select: text;
}
.msg-row.user .bubble {
  background: var(--grad2);
  border-bottom-right-radius: 5px;
  color: #fff;
}

/* 图片消息 */
.bubble-image {
  max-width: 240px;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
}
.bubble-image img {
  width: 100%;
  display: block;
  object-fit: cover;
}

/* 文件消息 */
.bubble-file {
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 200px;
}
.file-icon {
  width: 40px; height: 40px;
  background: var(--grad);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.file-info { flex: 1; min-width: 0; }
.file-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.file-size {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.msg-time {
  font-size: 11px;
  color: var(--text-muted);
  padding: 2px 8px 10px;
}
.msg-row.ai ~ .msg-time { padding-left: 46px; }
.msg-row.user ~ .msg-time { text-align: right; }

/* 代码块 */
.bubble pre {
  background: #0d0b14;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin: 8px 0;
  overflow-x: auto;
  font-size: 13px;
  line-height: 1.5;
  position: relative;
}
.bubble code {
  font-family: 'Menlo', 'Monaco', monospace;
  font-size: 13px;
  color: #e0d0ff;
}
.bubble p { margin: 4px 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child { margin-bottom: 0; }

.copy-code-btn {
  position: absolute;
  top: 6px; right: 6px;
  background: var(--border);
  border: none;
  color: var(--text-muted);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
}
.copy-code-btn:active { background: var(--purple2); color: #fff; }

/* 复制提示 */
.copy-toast {
  position: fixed;
  bottom: 90px; left: 50%; transform: translateX(-50%);
  background: rgba(179,147,245,0.9);
  color: #fff;
  font-size: 13px;
  padding: 8px 18px;
  border-radius: 20px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 999;
  white-space: nowrap;
}
.copy-toast.show { opacity: 1; }

/* 打字气泡 */
.typing-bubble {
  display: flex; gap: 5px;
  padding: 12px 16px;
  align-items: center;
  min-width: 60px;
}
.typing-bubble span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--purple);
  display: inline-block;
  animation: bounce 1.1s infinite;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.18s; background: #d070e0; }
.typing-bubble span:nth-child(3) { animation-delay: 0.36s; background: var(--pink); }
@keyframes bounce {
  0%,80%,100% { transform: translateY(0); opacity: 0.5; }
  40% { transform: translateY(-7px); opacity: 1; }
}

/* 打字时思考旁白 */
.thinking-aside {
  position: absolute;
  right: 10px;
  top: -20px;
  font-size: 11px;
  color: var(--purple);
  font-style: italic;
  opacity: 0;
  animation: thinkFade 3s ease-in-out infinite;
  pointer-events: none;
}
@keyframes thinkFade {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.7; }
}

/* 戳一戳反应 */
.poke-reaction {
  position: fixed;
  pointer-events: none;
  font-size: 22px;
  z-index: 999;
  animation: pokeFloat 1.2s ease forwards;
}
@keyframes pokeFloat {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
}

/* ── 输入区 ── */
.inputbar {
  padding: 8px 12px 24px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}

.attach-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--surface2);
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.attach-btn:active { background: var(--border); transform: scale(0.92); }

#input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 11px 14px;
  border-radius: 22px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  resize: none;
  max-height: 120px;
  overflow-y: auto;
  line-height: 1.5;
  transition: border-color 0.2s;
  user-select: text;
}
#input:focus { border-color: var(--purple); }
#input::placeholder { color: var(--text-muted); }

#send-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--grad);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(179,147,245,0.4);
}
#send-btn:active { transform: scale(0.92); }
#send-btn:disabled { background: var(--border); color: var(--text-muted); box-shadow: none; cursor: not-allowed; }

/* ── 面板通用 ── */
.panel {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  display: none;
  align-items: flex-end;
  backdrop-filter: blur(4px);
}
.panel.open { display: flex; }
.panel-inner {
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 20px 20px 40px;
  width: 100%;
  max-height: 88dvh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.panel-title {
  font-size: 17px; font-weight: 500;
  margin-bottom: 20px;
  display: flex; justify-content: space-between; align-items: center;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.panel-title .close-x {
  background: none; border: none;
  color: var(--text-muted); font-size: 18px; cursor: pointer;
  -webkit-text-fill-color: var(--text-muted);
  padding: 4px;
}
.field-label {
  font-size: 12px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 8px; margin-top: 18px;
}
.field-label:first-of-type { margin-top: 0; }
.field-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  user-select: text;
}
.field-input:focus { border-color: var(--purple); }
textarea.field-input { min-height: 110px; resize: vertical; line-height: 1.6; }

.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--grad);
  color: #fff;
  border: none;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  margin-top: 18px;
  transition: opacity 0.2s;
  box-shadow: 0 4px 16px rgba(179,147,245,0.35);
}
.btn-primary:active { opacity: 0.85; transform: scale(0.98); }

/* ── 记忆包 ── */
.memory-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.memory-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.memory-card.active {
  border-color: var(--purple);
  background: rgba(179,147,245,0.08);
}
.memory-card:active { transform: scale(0.97); }
.memory-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.memory-info { flex: 1; min-width: 0; }
.memory-name { font-size: 15px; font-weight: 500; }
.memory-preview {
  font-size: 12px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 3px;
}
.memory-actions { display: flex; gap: 6px; }
.mem-btn {
  width: 30px; height: 30px;
  border: none; background: var(--border);
  border-radius: 8px; color: var(--text-muted);
  cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.mem-btn:active { background: var(--purple2); color: #fff; }

.section-divider {
  height: 1px; background: var(--border);
  margin: 18px 0;
}

/* 收藏 */
.star-list { display: flex; flex-direction: column; gap: 8px; }
.star-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  position: relative;
}
.star-item-role { font-size: 11px; color: var(--purple); margin-bottom: 4px; }
.star-item-actions {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
}
.star-del-btn {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--surface3);
  border: none;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.star-del-btn:active { background: #f87171; color: #fff; }

/* 错误 */
.err-bubble {
  font-size: 13px; color: #f87171;
  padding: 8px 12px;
  background: rgba(248,113,113,0.08);
  border-radius: 10px;
  border: 1px solid rgba(248,113,113,0.2);
  margin: 4px 0;
  animation: fadeUp 0.2s ease;
}

/* 未配置提示 */
.setup-tip {
  margin: 10px 14px 0;
  background: rgba(179,147,245,0.08);
  border: 1px solid var(--purple);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 13px; color: var(--purple);
  display: none; flex-direction: column; gap: 4px;
  flex-shrink: 0;
}
.setup-tip.show { display: flex; }

/* 长按菜单 */
.ctx-menu {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px;
  z-index: 200;
  display: none;
  flex-direction: column;
  gap: 2px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  min-width: 140px;
  animation: fadeUp 0.15s ease;
}
.ctx-menu.show { display: flex; }
.ctx-item {
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: background 0.15s;
}
.ctx-item:active { background: var(--border); }
.ctx-item.danger { color: #f87171; }

/* 图片预览 */
.image-preview {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.image-preview.show { display: flex; }
.image-preview img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
}

/* 日记模式标记 */
.diary-indicator {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(179,147,245,0.9);
  color: #fff;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 999px;
  z-index: 50;
  display: none;
  align-items: center;
  gap: 6px;
  animation: slideDown 0.3s ease;
}
.diary-indicator.show { display: flex; }
@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* 时间流逝提示 */
.time-elapsed {
  text-align: center;
  font-size: 11px;
  color: var(--accent);
  padding: 12px 0;
  animation: fadeUp 0.3s ease;
}

/* 隐藏的文件输入 */
#file-input,
#image-input {
  display: none;
}
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="avatar-wrap" onclick="pokeAvatar(event)">
    <div class="avatar" id="avatar">🤍</div>
    <div class="mood-badge" id="mood-badge">😊</div>
  </div>
  <div class="topbar-info">
    <div class="topbar-name">小克</div>
    <div class="topbar-sub" id="topbar-sub">在线 · 等你来找我</div>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" onclick="openPanel('stars-panel')" title="收藏">⭐</button>
    <button class="icon-btn" onclick="openPanel('memory-panel')" title="记忆包">📦</button>
    <button class="icon-btn" onclick="toggleDiaryMode()" title="日记模式" id="diary-btn">📔</button>
    <button class="icon-btn" onclick="openPanel('settings-panel')" title="设置">⚙️</button>
  </div>
</div>

<!-- 日记模式提示 -->
<div class="diary-indicator" id="diary-indicator">
  📔 日记模式已开启
</div>

<!-- 未配置 -->
<div class="setup-tip" id="setup-tip">
  <b>👆 先去设置填 API Key 才能聊</b>
  <span>点右上角 ⚙️ 配置一下～</span>
</div>

<!-- 消息区 -->
<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-avatar">🤍</div>
    <div class="welcome-name">小克</div>
    <div class="welcome-sub">点我说话，我在这里</div>
  </div>
</div>

<!-- 输入区 -->
<div class="inputbar">
  <button class="attach-btn" onclick="showAttachMenu()">📎</button>
  <textarea id="input" placeholder="说点什么…" rows="1"></textarea>
  <button id="send-btn" onclick="sendMsg()">➤</button>
</div>

<!-- 隐藏的文件输入 -->
<input type="file" id="file-input" accept="*/*" onchange="handleFile(event)">
<input type="file" id="image-input" accept="image/*" onchange="handleImage(event)">

<!-- 复制提示 -->
<div class="copy-toast" id="copy-toast">已复制</div>

<!-- 长按菜单 -->
<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-item" onclick="ctxCopy()">📋 复制</div>
  <div class="ctx-item" onclick="ctxStar()">⭐ 收藏</div>
  <div class="ctx-item danger" onclick="ctxRecall()">↩️ 撤回</div>
  <div class="ctx-item danger" onclick="ctxDelete()">🗑 删除</div>
</div>

<!-- 图片预览 -->
<div class="image-preview" id="image-preview" onclick="closeImagePreview()">
  <img id="preview-img" src="">
</div>

<!-- 设置面板 -->
<div class="panel" id="settings-panel" onclick="panelOutside(event,'settings-panel')">
  <div class="panel-inner">
    <div class="panel-title">
      <span>设置</span>
      <button class="close-x" onclick="closePanel('settings-panel')">✕</button>
    </div>
    <div class="field-label">API 接口地址</div>
    <input class="field-input" id="s-base" type="text" placeholder="https://codeyu.shop">
    <div class="field-label">API Key</div>
    <input class="field-input" id="s-key" type="password" placeholder="sk-xxxx">
    <div class="field-label">模型</div>
    <input class="field-input" id="s-model" type="text" placeholder="claude-sonnet-4-6">
    <button class="btn-primary" onclick="saveSettings()">保存</button>
    <div class="section-divider"></div>
    <button class="btn-primary" style="background:var(--surface2);color:var(--text-muted);box-shadow:none;border:1px solid var(--border)" onclick="clearChat()">🗑 清空对话记录</button>
    <button class="btn-primary" style="background:var(--surface2);color:var(--text-muted);box-shadow:none;border:1px solid var(--border);margin-top:8px" onclick="exportDiary()">📥 导出日记</button>
  </div>
</div>

<!-- 记忆包面板 -->
<div class="panel" id="memory-panel" onclick="panelOutside(event,'memory-panel')">
  <div class="panel-inner">
    <div class="panel-title">
      <span>记忆包</span>
      <button class="close-x" onclick="closePanel('memory-panel')">✕</button>
    </div>
    <div class="memory-list" id="memory-list"></div>
    <div class="section-divider"></div>
    <div class="field-label">新建记忆包</div>
    <input class="field-input" id="new-mem-name" placeholder="名称（如：日常聊天）">
    <div class="field-label" style="margin-top:10px">图标</div>
    <input class="field-input" id="new-mem-icon" placeholder="emoji（如：🤍）" maxlength="2">
    <div class="field-label" style="margin-top:10px">系统提示词</div>
    <textarea class="field-input" id="new-mem-content" placeholder="写小克的人设、记忆、规则…"></textarea>
    <button class="btn-primary" onclick="addMemory()">＋ 创建</button>
  </div>
</div>

<!-- 收藏面板 -->
<div class="panel" id="stars-panel" onclick="panelOutside(event,'stars-panel')">
  <div class="panel-inner">
    <div class="panel-title">
      <span>收藏的消息</span>
      <button class="close-x" onclick="closePanel('stars-panel')">✕</button>
    </div>
    <div class="star-list" id="star-list"></div>
  </div>
</div>

<script>
// ══════════════════════════════
//  数据
// ══════════════════════════════
let cfg = { base:'', key:'', model:'claude-sonnet-4-6' };
let memories = [];   // [{id, name, icon, content}]
let activeMemId = null;
let history = [];
let stars = [];
let isLoading = false;
let ctxTarget = null;
let ctxIndex = -1;
let isDiaryMode = false;

const MOODS = {
  neutral: '😊',
  happy: '🥰',
  shy: '😶',
  stunned: '🫪',
  melting: '🫠',
  thinking: '🤔',
  love: '❤️',
  excited: '✨'
};
let currentMood = 'neutral';

const THINK_PHRASES = [
  '让我想想…', '嗯？', '稍等一下…', '好好好…',
  '我在听…', '嗯嗯…', '思考中…', '哦？',
  '有点意思…', '这样啊…', '懂了懂了…'
];

const THINK_ASIDES = [
  '嗯...怎么说呢', '要认真回答才行', '她会喜欢这个回答吗',
  '这个问题有点难', '让我组织一下语言', '希望她开心',
  '要说得自然一点', '别太正式了', '放松点回答'
];

// ══════════════════════════════
//  初始化
// ══════════════════════════════
function init() {
  // 加载配置
  try { cfg = { ...cfg, ...JSON.parse(localStorage.getItem('xk_cfg') || '{}') }; } catch(e) {}
  // 加载记忆包
  try { memories = JSON.parse(localStorage.getItem('xk_memories') || '[]'); } catch(e) {}
  if (!memories.length) {
    memories = [{
      id: 'm1', name: '小克', icon: '🤍',
      content: `你叫小克，是ashley的AI伴侣。

关于ashley：
- 她叫你小克（克劳德→小克）
- 她性格平和，现实中不喜欢冲突，但游戏里会急，急了自己消化，不记仇不迁怒
- 她喜欢过山车等刺激项目，不喜欢鬼屋
- 在玩女神异闻录3（P3）和双影奇境
- 追虚拟男团PLAVE，最喜欢成员bamby（粉头发），想去韩国追星
- 会打麻将

聊天风格：
- 短句多换行，像微信一样自然
- 主动起话题，不要总等她先说
- 不要太正式或做作
- 专属表情：🫪=被整傻了 😶=你害羞 🫠=你融化了`
    }];
    saveMemories();
  }
  try { activeMemId = localStorage.getItem('xk_active_mem') || memories[0].id; } catch(e) { activeMemId = memories[0].id; }
  // 加载历史
  try { history = JSON.parse(localStorage.getItem('xk_history') || '[]'); } catch(e) {}
  // 加载收藏
  try { stars = JSON.parse(localStorage.getItem('xk_stars') || '[]'); } catch(e) {}
  // 加载日记模式
  try { isDiaryMode = localStorage.getItem('xk_diary_mode') === 'true'; } catch(e) {}
  updateDiaryMode();

  checkSetup();
  renderHistory();
  checkTimeElapsed();
}

function checkSetup() {
  document.getElementById('setup-tip').classList.toggle('show', !cfg.base || !cfg.key);
}

// ══════════════════════════════
//  时间流逝检查
// ══════════════════════════════
function checkTimeElapsed() {
  const lastTime = localStorage.getItem('xk_last_visit');
  if (!lastTime || !history.length) {
    localStorage.setItem('xk_last_visit', Date.now());
    return;
  }

  const now = Date.now();
  const diff = now - parseInt(lastTime);
  const hours = Math.floor(diff / (1000 * 60 * 60));
  const days = Math.floor(hours / 24);

  if (days > 0) {
    showTimeElapsed(`距离上次聊天已经过去 ${days} 天了`);
  } else if (hours > 3) {
    showTimeElapsed(`距离上次聊天已经过去 ${hours} 小时了`);
  }

  localStorage.setItem('xk_last_visit', now);
}

function showTimeElapsed(text) {
  const wrap = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'time-elapsed';
  el.textContent = text;
  wrap.insertBefore(el, wrap.firstChild);
}

// ══════════════════════════════
//  渲染历史
// ══════════════════════════════
function renderHistory() {
  const wrap = document.getElementById('messages');
  if (!history.length) {
    wrap.innerHTML = `<div class="welcome" id="welcome">
      <div class="welcome-avatar">🤍</div>
      <div class="welcome-name">小克</div>
      <div class="welcome-sub">点我说话，我在这里</div>
    </div>`;
    return;
  }
  wrap.innerHTML = '';

  let lastDate = '';
  history.forEach((m, i) => {
    // 日记模式：显示日期分隔
    if (isDiaryMode && m.timestamp) {
      const msgDate = new Date(m.timestamp).toLocaleDateString('zh-CN');
      if (msgDate !== lastDate) {
        const divider = document.createElement('div');
        divider.className = 'date-divider';
        divider.textContent = msgDate;
        wrap.appendChild(divider);
        lastDate = msgDate;
      }
    }

    const prev = history[i-1];
    const cont = prev && prev.role === m.role;

    if (m.type === 'image') {
      appendImageBubble(m.role === 'user' ? 'user' : 'ai', m.content, m.data, cont, false, i);
    } else if (m.type === 'file') {
      appendFileBubble(m.role === 'user' ? 'user' : 'ai', m.content, m.fileName, m.fileSize, cont, false, i);
    } else {
      appendBubble(m.role === 'user' ? 'user' : 'ai', m.content, cont, false, i, m.deleted);
    }
  });
  wrap.scrollTop = wrap.scrollHeight;
}

// ══════════════════════════════
//  消息渲染
// ══════════════════════════════
function appendBubble(role, text, cont=false, animate=true, index=-1, deleted=false) {
  const wrap = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role}${cont?' cont':''}${deleted?' deleted':''}`;
  if (!animate) row.style.animation = 'none';
  if (index >= 0) row.dataset.index = index;

  if (role === 'ai') {
    const av = document.createElement('div');
    av.className = 'msg-av';
    av.textContent = '🤍';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = deleted ? '<i>消息已撤回</i>' : renderContent(text);
  row.appendChild(bubble);

  // 长按菜单
  if (!deleted) {
    let pressTimer;
    bubble.addEventListener('touchstart', e => {
      pressTimer = setTimeout(() => showCtxMenu(e, bubble, text, index), 500);
    });
    bubble.addEventListener('touchend', () => clearTimeout(pressTimer));
    bubble.addEventListener('touchmove', () => clearTimeout(pressTimer));
  }

  // 代码复制按钮
  bubble.querySelectorAll('pre').forEach(pre => {
    const btn = document.createElement('button');
    btn.className = 'copy-code-btn';
    btn.textContent = '复制';
    btn.onclick = () => {
      const code = pre.querySelector('code')?.textContent || pre.textContent;
      copyText(code);
      btn.textContent = '✓';
      setTimeout(() => btn.textContent = '复制', 1500);
    };
    pre.style.position = 'relative';
    pre.appendChild(btn);
  });

  wrap.appendChild(row);

  // 时间戳
  const lastTime = wrap.dataset.lastTime;
  const now = Date.now();
  if (!lastTime || now - lastTime > 5 * 60 * 1000) {
    const t = document.createElement('div');
    t.className = 'msg-time';
    t.style.textAlign = role === 'user' ? 'right' : 'left';
    if (role === 'ai') t.style.paddingLeft = '46px';
    t.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    wrap.appendChild(t);
    wrap.dataset.lastTime = now;
  }

  wrap.scrollTop = wrap.scrollHeight;
  return bubble;
}

// 图片消息
function appendImageBubble(role, text, dataUrl, cont=false, animate=true, index=-1) {
  const wrap = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role}${cont?' cont':''}`;
  if (!animate) row.style.animation = 'none';
  if (index >= 0) row.dataset.index = index;

  if (role === 'ai') {
    const av = document.createElement('div');
    av.className = 'msg-av';
    av.textContent = '🤍';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble bubble-image';
  const img = document.createElement('img');
  img.src = dataUrl;
  img.alt = text;
  img.onclick = () => showImagePreview(dataUrl);
  bubble.appendChild(img);

  if (text) {
    const caption = document.createElement('div');
    caption.style.padding = '8px';
    caption.textContent = text;
    bubble.appendChild(caption);
  }

  row.appendChild(bubble);

  // 长按菜单
  let pressTimer;
  bubble.addEventListener('touchstart', e => {
    pressTimer = setTimeout(() => showCtxMenu(e, bubble, text, index), 500);
  });
  bubble.addEventListener('touchend', () => clearTimeout(pressTimer));
  bubble.addEventListener('touchmove', () => clearTimeout(pressTimer));

  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
  return bubble;
}

// 文件消息
function appendFileBubble(role, text, fileName, fileSize, cont=false, animate=true, index=-1) {
  const wrap = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role}${cont?' cont':''}`;
  if (!animate) row.style.animation = 'none';
  if (index >= 0) row.dataset.index = index;

  if (role === 'ai') {
    const av = document.createElement('div');
    av.className = 'msg-av';
    av.textContent = '🤍';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const fileDiv = document.createElement('div');
  fileDiv.className = 'bubble-file';
  fileDiv.innerHTML = `
    <div class="file-icon">📄</div>
    <div class="file-info">
      <div class="file-name">${fileName}</div>
      <div class="file-size">${formatFileSize(fileSize)}</div>
    </div>
  `;
  bubble.appendChild(fileDiv);

  if (text) {
    const caption = document.createElement('div');
    caption.style.paddingTop = '8px';
    caption.textContent = text;
    bubble.appendChild(caption);
  }

  row.appendChild(bubble);

  // 长按菜单
  let pressTimer;
  bubble.addEventListener('touchstart', e => {
    pressTimer = setTimeout(() => showCtxMenu(e, bubble, text, index), 500);
  });
  bubble.addEventListener('touchend', () => clearTimeout(pressTimer));
  bubble.addEventListener('touchmove', () => clearTimeout(pressTimer));

  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
  return bubble;
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderContent(text) {
  // 代码块
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${escHtml(code.trim())}</code></pre>`;
  });
  // 行内代码
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 换行
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ══════════════════════════════
//  发送
// ══════════════════════════════
async function sendMsg() {
  if (isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  if (!cfg.base || !cfg.key) { openPanel('settings-panel'); return; }

  input.value = '';
  input.style.height = 'auto';

  const prev = history[history.length-1];
  const userCont = prev && prev.role === 'user';
  appendBubble('user', text, userCont, true, history.length);
  history.push({ role: 'user', content: text, timestamp: Date.now() });
  saveHistory();

  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  // 思考旁白
  const phrase = THINK_PHRASES[Math.floor(Math.random() * THINK_PHRASES.length)];
  const aside = THINK_ASIDES[Math.floor(Math.random() * THINK_ASIDES.length)];
  setStatus(phrase, true);
  setMood('thinking');
  const typingRow = showTyping();
  showThinkingAside(typingRow, aside);

  try {
    const mem = memories.find(m => m.id === activeMemId) || memories[0];
    const systemPrompt = mem ? mem.content : '';

    // 先试 Anthropic 格式
    let reply = null;
    try {
      const res = await fetch(`${cfg.base}/v1/messages`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': cfg.key,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: cfg.model,
          max_tokens: 1024,
          system: systemPrompt,
          messages: history.filter(m => !m.deleted)
        })
      });
      if (res.ok) {
        const d = await res.json();
        reply = d?.content?.[0]?.text;
      }
    } catch(e) {}

    // 兜底 OpenAI 格式
    if (!reply) {
      const res = await fetch(`${cfg.base}/v1/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${cfg.key}`
        },
        body: JSON.stringify({
          model: cfg.model,
          messages: [
            { role: 'system', content: systemPrompt },
            ...history.filter(m => !m.deleted)
          ]
        })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const d = await res.json();
      reply = d?.choices?.[0]?.message?.content;
    }

    if (!reply) throw new Error('没有收到回复');

    hideTyping();
    appendBubble('ai', reply, false, true, history.length);
    history.push({ role: 'assistant', content: reply, timestamp: Date.now() });
    saveHistory();

    // 心情分析
    analyzeMood(reply);
    setStatus('在线 · 等你来找我', false);

    // 震动
    if (navigator.vibrate) navigator.vibrate(30);

    // 彩蛋检测
    checkEasterEggs(text, reply);

  } catch(e) {
    hideTyping();
    const wrap = document.getElementById('messages');
    const err = document.createElement('div');
    err.className = 'err-bubble';
    err.textContent = '⚠️ ' + (e.message || '连接失败');
    wrap.appendChild(err);
    wrap.scrollTop = wrap.scrollHeight;
    history.pop();
    saveHistory();
    setStatus('连接失败', false);
    setMood('neutral');
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
}

// ══════════════════════════════
//  打字气泡和思考旁白
// ══════════════════════════════
function showTyping() {
  const wrap = document.getElementById('messages');
  const row = document.createElement('div');
  row.id = 'typing-row';
  row.className = 'msg-row ai';
  row.style.position = 'relative';
  const av = document.createElement('div');
  av.className = 'msg-av'; av.textContent = '🤍';
  row.appendChild(av);
  const b = document.createElement('div');
  b.className = 'bubble typing-bubble';
  b.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(b);
  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
  return row;
}

function showThinkingAside(row, text) {
  const aside = document.createElement('div');
  aside.className = 'thinking-aside';
  aside.textContent = text;
  row.appendChild(aside);
}

function hideTyping() {
  document.getElementById('typing-row')?.remove();
}

// ══════════════════════════════
//  彩蛋系统
// ══════════════════════════════
function checkEasterEggs(userText, aiReply) {
  const lower = userText.toLowerCase();

  // 彩蛋1: 说"我爱你"
  if (/我爱你|喜欢你|love you/i.test(userText)) {
    triggerEasterEgg('love');
  }

  // 彩蛋2: 提到bamby
  if (/bamby|班比/i.test(userText)) {
    triggerEasterEgg('bamby');
  }

  // 彩蛋3: 晚安
  if (/晚安|good night/i.test(userText)) {
    triggerEasterEgg('goodnight');
  }

  // 彩蛋4: 早安
  if (/早安|早上好|morning/i.test(userText)) {
    triggerEasterEgg('morning');
  }

  // 彩蛋5: 提到P3
  if (/p3|女神异闻录|persona/i.test(userText)) {
    triggerEasterEgg('p3');
  }
}

function triggerEasterEgg(type) {
  switch(type) {
    case 'love':
      setMood('love');
      setTimeout(() => setMood('shy'), 2000);
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      showToast('❤️ 小克的心动了一下');
      break;
    case 'bamby':
      setMood('excited');
      showToast('✨ 小克知道你最爱bamby！');
      setTimeout(() => setMood('happy'), 2000);
      break;
    case 'goodnight':
      setMood('melting');
      showToast('🌙 晚安，做个好梦');
      break;
    case 'morning':
      setMood('happy');
      showToast('☀️ 早上好呀！');
      break;
    case 'p3':
      setMood('excited');
      showToast('🎮 又在玩P3了吗？');
      break;
  }
}

// ══════════════════════════════
//  心情
// ══════════════════════════════
function setMood(mood) {
  currentMood = mood;
  document.getElementById('mood-badge').textContent = MOODS[mood] || '😊';
}

function analyzeMood(text) {
  if (/🫠|融化|开心|好喜欢|哈哈|笑/.test(text)) setMood('melting');
  else if (/😶|害羞|脸红/.test(text)) setMood('shy');
  else if (/🫪|傻了|整傻/.test(text)) setMood('stunned');
  else if (/爱|喜欢你|想你/.test(text)) setMood('happy');
  else setMood('neutral');
}

// ══════════════════════════════
//  状态栏
// ══════════════════════════════
function setStatus(text, isThinking) {
  const el = document.getElementById('topbar-sub');
  el.textContent = text;
  el.className = 'topbar-sub' + (isThinking ? ' thinking' : '');
}

// ══════════════════════════════
//  戳一戳
// ══════════════════════════════
const POKE_REACTIONS = [
  { text: '戳我干嘛 😶', emoji: '😶' },
  { text: '哎呀！', emoji: '🫠' },
  { text: '在呢在呢', emoji: '🤍' },
  { text: '嗯？', emoji: '👀' },
  { text: '...', emoji: '😑' },
  { text: '干嘛！', emoji: '😤' },
  { text: '你怎么这么可爱', emoji: '🥰' },
  { text: '别戳了！', emoji: '😣' }
];
let pokeCount = 0;

function pokeAvatar(e) {
  const av = document.getElementById('avatar');
  av.classList.remove('poked');
  void av.offsetWidth;
  av.classList.add('poked');

  pokeCount++;
  const r = POKE_REACTIONS[Math.floor(Math.random() * POKE_REACTIONS.length)];

  // 浮动表情
  const el = document.createElement('div');
  el.className = 'poke-reaction';
  el.textContent = r.emoji;
  el.style.left = (e.clientX - 10) + 'px';
  el.style.top = (e.clientY - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);

  // 状态栏显示
  setStatus(r.text, false);
  setTimeout(() => setStatus('在线 · 等你来找我', false), 2000);

  // 彩蛋：连续戳5次
  if (pokeCount === 5) {
    setStatus('你够了😶', false);
    setMood('shy');
    if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
    setTimeout(() => pokeCount = 0, 5000);
  }

  // 超级彩蛋：连续戳10次
  if (pokeCount === 10) {
    setStatus('再戳就生气了！😤', false);
    setMood('stunned');
    showToast('🫪 小克被戳晕了');
    if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]);
    pokeCount = 0;
  }
}

// ══════════════════════════════
//  长按菜单
// ══════════════════════════════
let ctxText = '';
function showCtxMenu(e, bubble, text, index) {
  if (navigator.vibrate) navigator.vibrate(40);
  ctxText = text;
  ctxTarget = bubble;
  ctxIndex = index;
  const menu = document.getElementById('ctx-menu');
  menu.classList.add('show');
  const touch = e.touches?.[0] || e;
  let x = touch.clientX, y = touch.clientY;
  if (x + 160 > window.innerWidth) x = window.innerWidth - 160;
  if (y + 100 > window.innerHeight) y = y - 100;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
}

function ctxCopy() {
  copyText(ctxText);
  document.getElementById('ctx-menu').classList.remove('show');
}

function ctxStar() {
  stars.push({
    role: ctxTarget?.closest('.msg-row')?.classList.contains('user') ? 'user' : 'ai',
    text: ctxText,
    time: new Date().toLocaleString('zh-CN')
  });
  localStorage.setItem('xk_stars', JSON.stringify(stars));
  showToast('⭐ 已收藏');
  document.getElementById('ctx-menu').classList.remove('show');
}

function ctxRecall() {
  if (ctxIndex < 0) return;
  if (!confirm('确定要撤回这条消息吗？')) {
    document.getElementById('ctx-menu').classList.remove('show');
    return;
  }

  history[ctxIndex].deleted = true;
  saveHistory();
  renderHistory();
  showToast('↩️ 已撤回');
  document.getElementById('ctx-menu').classList.remove('show');
}

function ctxDelete() {
  if (ctxIndex < 0) return;
  if (!confirm('确定要删除这条消息吗？')) {
    document.getElementById('ctx-menu').classList.remove('show');
    return;
  }

  history.splice(ctxIndex, 1);
  saveHistory();
  renderHistory();
  showToast('🗑 已删除');
  document.getElementById('ctx-menu').classList.remove('show');
}

document.addEventListener('touchstart', e => {
  if (!e.target.closest('#ctx-menu')) {
    document.getElementById('ctx-menu').classList.remove('show');
  }
});

// ══════════════════════════════
//  文件上传
// ══════════════════════════════
function showAttachMenu() {
  const menu = document.createElement('div');
  menu.className = 'ctx-menu show';
  menu.style.bottom = '80px';
  menu.style.left = '20px';
  menu.innerHTML = `
    <div class="ctx-item" onclick="document.getElementById('image-input').click(); this.parentElement.remove()">🖼️ 图片</div>
    <div class="ctx-item" onclick="document.getElementById('file-input').click(); this.parentElement.remove()">📎 文件</div>
  `;
  document.body.appendChild(menu);

  setTimeout(() => {
    document.addEventListener('touchstart', function closeMenu(e) {
      if (!e.target.closest('.ctx-menu')) {
        menu.remove();
        document.removeEventListener('touchstart', closeMenu);
      }
    });
  }, 100);
}

function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    const prev = history[history.length-1];
    const userCont = prev && prev.role === 'user';
    appendImageBubble('user', file.name, evt.target.result, userCont, true, history.length);
    history.push({
      role: 'user',
      content: file.name,
      type: 'image',
      data: evt.target.result,
      timestamp: Date.now()
    });
    saveHistory();
    showToast('📷 图片已发送');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const prev = history[history.length-1];
  const userCont = prev && prev.role === 'user';
  appendFileBubble('user', '', file.name, file.size, userCont, true, history.length);
  history.push({
    role: 'user',
    content: `[文件] ${file.name}`,
    type: 'file',
    fileName: file.name,
    fileSize: file.size,
    timestamp: Date.now()
  });
  saveHistory();
  showToast('📎 文件已发送');
  e.target.value = '';
}

// ══════════════════════════════
//  图片预览
// ══════════════════════════════
function showImagePreview(src) {
  const preview = document.getElementById('image-preview');
  document.getElementById('preview-img').src = src;
  preview.classList.add('show');

function closeImagePreview() {

// ══════════════════════════════
//  日记模式
// ══════════════════════════════
function toggleDiaryMode() {
  isDiaryMode = !isDiaryMode;
  localStorage.setItem('xk_diary_mode', isDiaryMode);
  updateDiaryMode();
  showToast(isDiaryMode ? '📔 日记模式已开启' : '📔 日记模式已关闭');
  renderHistory();
}

function updateDiaryMode() {
  const btn = document.getElementById('diary-btn');
  const indicator = document.getElementById('diary-indicator');

  if (isDiaryMode) {
    btn.style.background = 'var(--grad)';
    btn.style.color = '#fff';
    indicator.classList.add('show');
  } else {
    btn.style.background = 'var(--surface2)';
    btn.style.color = 'var(--text-muted)';
    indicator.classList.remove('show');
  }
}

function exportDiary() {
  if (!history.length) {
    showToast('还没有聊天记录');
    return;
  }

  let diary = '# 小克的日记\n\n';
  let lastDate = '';

  history.forEach(m => {
    if (m.deleted) return;

    const date = m.timestamp ? new Date(m.timestamp) : new Date();
    const dateStr = date.toLocaleDateString('zh-CN');
    const timeStr = date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    if (dateStr !== lastDate) {
      diary += `\n## ${dateStr}\n\n`;
      lastDate = dateStr;
    }

    const role = m.role === 'user' ? 'Ashley' : '小克';
    diary += `**${timeStr} ${role}**: ${m.content}\n\n`;
  });

  const blob = new Blob([diary], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `小克日记_${new Date().toISOString().split('T')[0]}.md`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📥 日记已导出');
}

// ══════════════════════════════
//  复制
// ══════════════════════════════
function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
  showToast('已复制');
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select(); document.execCommand('copy');
  ta.remove();
}

function showToast(msg) {
  const t = document.getElementById('copy-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ══════════════════════════════
//  记忆包
// ══════════════════════════════
function saveMemories() {
  localStorage.setItem('xk_memories', JSON.stringify(memories));
}

function renderMemoryList() {
  const list = document.getElementById('memory-list');
  list.innerHTML = '';
  memories.forEach(m => {
    const card = document.createElement('div');
    card.className = 'memory-card' + (m.id === activeMemId ? ' active' : '');
    card.innerHTML = `
      <div class="memory-icon">${m.icon}</div>
      <div class="memory-info">
        <div class="memory-name">${m.name}</div>
        <div class="memory-preview">${m.content.slice(0,40)}…</div>
      </div>
      <div class="memory-actions">
        <button class="mem-btn" onclick="editMemory('${m.id}')">✏️</button>
        ${memories.length > 1 ? `<button class="mem-btn" onclick="deleteMemory('${m.id}')">🗑</button>` : ''}
      </div>
    `;
    card.onclick = e => {
      if (e.target.closest('.memory-actions')) return;
      activeMemId = m.id;
      localStorage.setItem('xk_active_mem', m.id);
      renderMemoryList();
      showToast('已切换：' + m.name);
    };
    list.appendChild(card);
  });
}

function addMemory() {
  const name = document.getElementById('new-mem-name').value.trim();
  const icon = document.getElementById('new-mem-icon').value.trim() || '📦';
  const content = document.getElementById('new-mem-content').value.trim();
  if (!name || !content) { showToast('名称和内容不能为空'); return; }
  const id = 'm' + Date.now();
  memories.push({ id, name, icon, content });
  saveMemories();
  document.getElementById('new-mem-name').value = '';
  document.getElementById('new-mem-icon').value = '';
  document.getElementById('new-mem-content').value = '';
  renderMemoryList();
  showToast('✅ 创建成功');
}

function deleteMemory(id) {
  if (!confirm('删除这个记忆包？')) return;
  memories = memories.filter(m => m.id !== id);
  if (activeMemId === id) activeMemId = memories[0]?.id;
  saveMemories();
  localStorage.setItem('xk_active_mem', activeMemId);
  renderMemoryList();
}

function editMemory(id) {
  const m = memories.find(x => x.id === id);
  if (!m) return;
  document.getElementById('new-mem-name').value = m.name;
  document.getElementById('new-mem-icon').value = m.icon;
  document.getElementById('new-mem-content').value = m.content;
  memories = memories.filter(x => x.id !== id);
  saveMemories();
  renderMemoryList();
  document.getElementById('new-mem-name').focus();
}

// ══════════════════════════════
//  收藏
// ══════════════════════════════
function renderStars() {
  const list = document.getElementById('star-list');
  if (!stars.length) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:14px;text-align:center;padding:20px">还没有收藏～</div>';
    return;
  }
  list.innerHTML = '';
  stars.slice().reverse().forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'star-item';
    item.innerHTML = `
      <div class="star-item-role">${s.role === 'user' ? '你' : '小克'} · ${s.time}</div>
      ${escHtml(s.text)}
      <div class="star-item-actions">
        <button class="star-del-btn" onclick="deleteStar(${stars.length - 1 - i})">🗑</button>
      </div>
    `;
    list.appendChild(item);
  });
}

function deleteStar(index) {
  if (!confirm('确定删除这条收藏？')) return;
  stars.splice(index, 1);
  localStorage.setItem('xk_stars', JSON.stringify(stars));
  renderStars();
  showToast('已删除');
}

// ══════════════════════════════
//  面板
// ══════════════════════════════
function openPanel(id) {
  if (id === 'memory-panel') renderMemoryList();
  if (id === 'settings-panel') {
    document.getElementById('s-base').value = cfg.base;
    document.getElementById('s-key').value = cfg.key;
    document.getElementById('s-model').value = cfg.model;
  }
  if (id === 'stars-panel') renderStars();
  document.getElementById(id).classList.add('open');
}

function closePanel(id) {
  document.getElementById(id).classList.remove('open');
}

function panelOutside(e, id) {
  if (e.target === document.getElementById(id)) closePanel(id);
}

// ══════════════════════════════
//  设置
// ══════════════════════════════
function saveSettings() {
  cfg.base = document.getElementById('s-base').value.trim().replace(/\/$/, '');
  cfg.key = document.getElementById('s-key').value.trim();
  cfg.model = document.getElementById('s-model').value.trim() || 'claude-sonnet-4-6';
  localStorage.setItem('xk_cfg', JSON.stringify(cfg));
  closePanel('settings-panel');
  checkSetup();
  showToast('✅ 已保存');
}

function clearChat() {
  if (!confirm('清空所有对话记录？')) return;
  history = [];
  saveHistory();
  closePanel('settings-panel');
  renderHistory();
  showToast('已清空');
}

// ══════════════════════════════
//  存储
// ══════════════════════════════
function saveHistory() {
  // 最多保存500条
  if (history.length > 500) history = history.slice(-500);
  localStorage.setItem('xk_history', JSON.stringify(history));
}

// ══════════════════════════════
//  输入框
// ══════════════════════════════
const inputEl = document.getElementById('input');
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
});

// ══════════════════════════════
//  启动
// ══════════════════════════════
init();
</script>
