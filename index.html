<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小克</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --bg: #05070c;
  --surface: #0f131c;
  --surface2: #161d2b;
  --surface3: #1e2636;
  --border: #2d2840;
  --purple: #b393f5;
  --pink: #f093c0;
  --purple2: #7c5cbf;
  --pink2: #c4587e;
  --accent: #38bdf8;
  --grad: linear-gradient(135deg, #b393f5, #f093c0);
  --grad2: linear-gradient(135deg, #7c5cbf, #c4587e);
  --glow: rgba(179,147,245,0.2);
  --text: #ede8f8;
  --text-muted: #7068a0;
  --radius: 18px;
}

/* 主题变量 */
[data-theme="pink"] {
  --bg: #0f0810;
  --surface: #1a0f1c;
  --surface2: #281828;
  --surface3: #362436;
  --border: #4a2d4a;
  --purple: #ff91d9;
  --pink: #ffc0e8;
  --purple2: #d05fb8;
  --pink2: #ff8fc7;
  --accent: #ff5fc4;
  --grad: linear-gradient(135deg, #ff91d9, #ffc0e8);
  --grad2: linear-gradient(135deg, #d05fb8, #ff8fc7);
}

[data-theme="blue"] {
  --bg: #060c12;
  --surface: #0d1621;
  --surface2: #152232;
  --surface3: #1e2f42;
  --border: #2d4159;
  --purple: #6eb5ff;
  --pink: #93d4ff;
  --purple2: #3d8dd9;
  --pink2: #5ba8f0;
  --accent: #38bdf8;
  --grad: linear-gradient(135deg, #6eb5ff, #93d4ff);
  --grad2: linear-gradient(135deg, #3d8dd9, #5ba8f0);
}

[data-theme="green"] {
  --bg: #070f0a;
  --surface: #0e1c14;
  --surface2: #162b1f;
  --surface3: #1f3a2b;
  --border: #2d4a3d;
  --purple: #6ee7b7;
  --pink: #86efac;
  --purple2: #34d399;
  --pink2: #4ade80;
  --accent: #10b981;
  --grad: linear-gradient(135deg, #6ee7b7, #86efac);
  --grad2: linear-gradient(135deg, #34d399, #4ade80);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  font-size: 15px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── 顶栏 ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.avatar-wrap {
  position: relative;
  flex-shrink: 0;
  cursor: pointer;
}

.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 16px rgba(179,147,245,0.5);
  transition: transform 0.15s;
  position: relative;
  overflow: hidden;
}
.avatar::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(255,255,255,0);
  border-radius: 50%;
  transition: background 0.2s;
}
.avatar.poked { animation: poke 0.4s ease; }
@keyframes poke {
  0% { transform: scale(1); }
  30% { transform: scale(0.85) rotate(-8deg); }
  60% { transform: scale(1.12) rotate(5deg); }
  100% { transform: scale(1) rotate(0); }
}

.mood-badge {
  position: absolute;
  bottom: -2px; right: -2px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  border: 2px solid var(--surface);
  transition: all 0.3s;
}

.topbar-info { flex: 1; min-width: 0; }
.topbar-name {
  font-size: 16px; font-weight: 500;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.topbar-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-height: 16px;
  transition: all 0.3s;
}
.topbar-sub.thinking { color: var(--purple); font-style: italic; }

.topbar-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px;
  border: none;
  background: var(--surface2);
  color: var(--text-muted);
  border-radius: 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  transition: all 0.2s;
  position: relative;
  z-index: 10;
  pointer-events: auto;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.icon-btn:active { background: var(--border); transform: scale(0.92); }

/* ── 消息区 ── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px 160px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overscroll-behavior: contain;
}
.messages::-webkit-scrollbar { width: 0; }

/* 欢迎 */
.welcome {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  flex: 1; gap: 16px; padding: 40px 20px;
}
.welcome-avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 38px;
  box-shadow: 0 0 40px rgba(179,147,245,0.4);
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.welcome-name {
  font-size: 22px; font-weight: 500;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.welcome-sub { font-size: 14px; color: var(--text-muted); }

/* 日记分隔 */
.date-divider {
  text-align: center;
  padding: 16px 0 8px;
  font-size: 12px;
  color: var(--text-muted);
  position: relative;
}
.date-divider::before,
.date-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 30%;
  height: 1px;
  background: var(--border);
}
.date-divider::before { left: 10%; }
.date-divider::after { right: 10%; }

/* 消息行 */
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  animation: fadeUp 0.22s ease;
  position: relative;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg-row.user { flex-direction: row-reverse; }
.msg-row + .msg-row { margin-top: 2px; }
.msg-row.user + .msg-row.ai,
.msg-row.ai + .msg-row.user { margin-top: 10px; }
.msg-row.deleted { opacity: 0.4; }
.msg-row.deleted .bubble {
  background: var(--surface) !important;
  color: var(--text-muted) !important;
  font-style: italic;
}

.msg-av {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  margin-bottom: 2px;
}
.msg-row.user .msg-av { display: none; }
.msg-row.ai.cont .msg-av { visibility: hidden; }

.bubble {
  max-width: 76%;
  padding: 10px 14px;
  border-radius: var(--radius);
  line-height: 1.7;
  font-size: 15px;
  word-break: break-word;
  position: relative;
  cursor: pointer;
  transition: opacity 0.15s;
}
.bubble:active { opacity: 0.75; }

.msg-row.ai .bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 5px;
  color: var(--text);
  user-select: text;
}
.msg-row.user .bubble {
  background: var(--grad2);
  border-bottom-right-radius: 5px;
  color: #fff;
}

/* 图片消息 */
.bubble-image {
  max-width: 240px;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
}
.bubble-image img {
  width: 100%;
  display: block;
  object-fit: cover;
}

/* 文件消息 */
.bubble-file {
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 200px;
}
.file-icon {
  width: 40px; height: 40px;
  background: var(--grad);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.file-info { flex: 1; min-width: 0; }
.file-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.file-size {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.msg-time {
  font-size: 11px;
  color: var(--text-muted);
  padding: 2px 8px 10px;
}
.msg-row.ai ~ .msg-time { padding-left: 46px; }
.msg-row.user ~ .msg-time { text-align: right; }

/* 代码块 */
.bubble pre {
  background: #0d0b14;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin: 8px 0;
  overflow-x: auto;
  font-size: 13px;
  line-height: 1.5;
  position: relative;
}
.bubble code {
  font-family: 'Menlo', 'Monaco', monospace;
  font-size: 13px;
  color: #e0d0ff;
}
.bubble p { margin: 4px 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child { margin-bottom: 0; }

.copy-code-btn {
  position: absolute;
  top: 6px; right: 6px;
  background: var(--border);
  border: none;
  color: var(--text-muted);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
}
.copy-code-btn:active { background: var(--purple2); color: #fff; }

/* 复制提示 */
.copy-toast {
  position: fixed;
  bottom: 90px; left: 50%; transform: translateX(-50%);
  background: rgba(179,147,245,0.9);
  color: #fff;
  font-size: 13px;
  padding: 8px 18px;
  border-radius: 20px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 999;
  white-space: nowrap;
}
.copy-toast.show { opacity: 1; }

/* 打字气泡 */
.typing-bubble {
  display: flex; gap: 5px;
  padding: 12px 16px;
  align-items: center;
  min-width: 60px;
}
.typing-bubble span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--purple);
  display: inline-block;
  animation: bounce 1.1s infinite;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.18s; background: #d070e0; }
.typing-bubble span:nth-child(3) { animation-delay: 0.36s; background: var(--pink); }
@keyframes bounce {
  0%,80%,100% { transform: translateY(0); opacity: 0.5; }
  40% { transform: translateY(-7px); opacity: 1; }
}

/* 打字时思考旁白 */
.thinking-aside {
  position: absolute;
  right: 10px;
  top: -20px;
  font-size: 11px;
  color: var(--purple);
  font-style: italic;
  opacity: 0;
  animation: thinkFade 3s ease-in-out infinite;
  pointer-events: none;
}
@keyframes thinkFade {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.7; }
}

/* 戳一戳反应 */
.poke-reaction {
  position: fixed;
  pointer-events: none;
  font-size: 22px;
  z-index: 999;
  animation: pokeFloat 1.2s ease forwards;
}
@keyframes pokeFloat {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
}

/* ── 输入区 ── */
.inputbar {
  padding: 8px 12px 24px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 500;
}

.attach-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--surface2);
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  z-index: 10;
  pointer-events: auto;
  touch-action: manipulation;
}
.attach-btn:active { background: var(--border); transform: scale(0.92); }

#input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 11px 14px;
  border-radius: 22px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  resize: none;
  max-height: 120px;
  overflow-y: auto;
  line-height: 1.5;
  transition: border-color 0.2s;
  user-select: text;
}
#input:focus { border-color: var(--purple); }
#input::placeholder { color: var(--text-muted); }

#send-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--grad);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(179,147,245,0.4);
  position: relative;
  z-index: 10;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;
  touch-action: manipulation;
}
#send-btn:active { transform: scale(0.92); }
#send-btn:disabled { background: var(--border); color: var(--text-muted); box-shadow: none; cursor: not-allowed; }

/* ── 面板通用 ── */
.panel {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  display: none;
  align-items: flex-end;
  backdrop-filter: blur(4px);
}
.panel.open { display: flex; }
.panel-inner {
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 20px 20px 40px;
  width: 100%;
  max-height: 88dvh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.panel-title {
  font-size: 17px; font-weight: 500;
  margin-bottom: 20px;
  display: flex; justify-content: space-between; align-items: center;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.panel-title .close-x {
  background: none; border: none;
  color: var(--text-muted); font-size: 18px; cursor: pointer;
  -webkit-text-fill-color: var(--text-muted);
  padding: 4px;
}
.field-label {
  font-size: 12px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 8px; margin-top: 18px;
}
.field-label:first-of-type { margin-top: 0; }
.field-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  user-select: text;
}
.field-input:focus { border-color: var(--purple); }
textarea.field-input { min-height: 110px; resize: vertical; line-height: 1.6; }

.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--grad);
  color: #fff;
  border: none;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  margin-top: 18px;
  transition: opacity 0.2s;
  box-shadow: 0 4px 16px rgba(179,147,245,0.35);
}
.btn-primary:active { opacity: 0.85; transform: scale(0.98); }

/* ── 记忆包 ── */
.memory-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.memory-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.memory-card.active {
  border-color: var(--purple);
  background: rgba(179,147,245,0.08);
}
.memory-card:active { transform: scale(0.97); }
.memory-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.memory-info { flex: 1; min-width: 0; }
.memory-name { font-size: 15px; font-weight: 500; }
.memory-preview {
  font-size: 12px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 3px;
}
.memory-actions { display: flex; gap: 6px; }
.mem-btn {
  width: 30px; height: 30px;
  border: none; background: var(--border);
  border-radius: 8px; color: var(--text-muted);
  cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.mem-btn:active { background: var(--purple2); color: #fff; }

.section-divider {
  height: 1px; background: var(--border);
  margin: 18px 0;
}

/* 收藏 */
.star-list { display: flex; flex-direction: column; gap: 8px; }
.star-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  position: relative;
}
.star-item-role { font-size: 11px; color: var(--purple); margin-bottom: 4px; }
.star-item-actions {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
}
.star-del-btn {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--surface3);
  border: none;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.star-del-btn:active { background: #f87171; color: #fff; }

/* 错误 */
.err-bubble {
  font-size: 13px; color: #f87171;
  padding: 8px 12px;
  background: rgba(248,113,113,0.08);
  border-radius: 10px;
  border: 1px solid rgba(248,113,113,0.2);
  margin: 4px 0;
  animation: fadeUp 0.2s ease;
}

/* 未配置提示 */
.setup-tip {
  margin: 10px 14px 0;
  background: rgba(179,147,245,0.08);
  border: 1px solid var(--purple);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 13px; color: var(--purple);
  display: none; flex-direction: column; gap: 4px;
  flex-shrink: 0;
}
.setup-tip.show { display: flex; }

/* 长按菜单 */
.ctx-menu {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px;
  z-index: 200;
  display: none;
  flex-direction: column;
  gap: 2px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  min-width: 140px;
  animation: fadeUp 0.15s ease;
}
.ctx-menu.show { display: flex; }
.ctx-item {
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: background 0.15s;
}
.ctx-item:active { background: var(--border); }
.ctx-item.danger { color: #f87171; }

/* 图片预览 */
.image-preview {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.image-preview.show { display: flex; }
.image-preview img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
}

/* 日记模式标记 */
.diary-indicator {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(179,147,245,0.9);
  color: #fff;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 999px;
  z-index: 50;
  display: none;
  align-items: center;
  gap: 6px;
  animation: slideDown 0.3s ease;
}
.diary-indicator.show { display: flex; }
@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* 时间流逝提示 */
.time-elapsed {
  text-align: center;
  font-size: 11px;
  color: var(--accent);
  padding: 12px 0;
  animation: fadeUp 0.3s ease;
}

/* 隐藏的文件输入 */
#file-input,
#image-input {
  display: none;
}

/* 在一起天数显示 */
.together-days {
  font-size: 11px;
  color: var(--accent);
  margin-top: 1px;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* 倒计时卡片 */
.countdown-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}
.countdown-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--grad);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.countdown-info {
  flex: 1;
  min-width: 0;
}
.countdown-name {
  font-size: 15px;
  font-weight: 500;
}
.countdown-time {
  font-size: 13px;
  color: var(--accent);
  margin-top: 3px;
}
.countdown-actions {
  display: flex;
  gap: 6px;
}

/* 日记浏览器小窗 */
.diary-viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(8px);
}
.diary-viewer.show { display: flex; }
.diary-viewer-inner {
  background: var(--surface);
  border-radius: 20px;
  width: 100%;
  max-width: 500px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: slideUp 0.3s ease;
}
.diary-viewer-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.diary-viewer-title {
  font-size: 17px;
  font-weight: 500;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.diary-viewer-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  font-size: 14px;
  line-height: 1.8;
}
.diary-viewer-date {
  font-size: 16px;
  font-weight: 500;
  color: var(--purple);
  margin: 20px 0 10px;
}
.diary-viewer-date:first-child { margin-top: 0; }
.diary-viewer-entry {
  margin: 8px 0;
  padding: 10px;
  background: var(--surface2);
  border-radius: 10px;
}
.diary-viewer-meta {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

/* 主题选择器 */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 10px;
}
.theme-option {
  padding: 14px;
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
}
.theme-option.active {
  border-color: var(--purple);
  background: rgba(179,147,245,0.1);
}
.theme-option:active { transform: scale(0.97); }
.theme-preview {
  width: 60px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  gap: 2px;
  overflow: hidden;
}
.theme-preview span {
  flex: 1;
}
.theme-name {
  font-size: 13px;
  font-weight: 500;
}

/* 头像上传 */
.avatar-upload {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--surface2);
  border: 2px dashed var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  cursor: pointer;
  margin: 10px auto;
  transition: all 0.2s;
  overflow: hidden;
  position: relative;
}
.avatar-upload:active { transform: scale(0.95); }
.avatar-upload img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.avatar-upload-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.6);
  opacity: 0;
  transition: opacity 0.2s;
  font-size: 12px;
  color: #fff;
}
.avatar-upload:hover .avatar-upload-label { opacity: 1; }

/* 快捷回复 */
.quick-replies {
  display: flex;
  gap: 6px;
  padding: 8px 12px;
  overflow-x: auto;
  flex-wrap: nowrap;
  position: fixed;
  bottom: 76px;
  left: 0;
  right: 0;
  background: var(--surface);
  z-index: 400;
  pointer-events: auto;
}
.quick-replies::-webkit-scrollbar { display: none; }
.quick-reply-btn {
  padding: 6px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;
  position: relative;
  z-index: 10;
  touch-action: manipulation;
}
.quick-reply-btn:active {
  background: var(--border);
  transform: scale(0.95);
}

/* 阿琚说小卡片 */
.daily-message {
  margin: 12px 14px;
  background: var(--grad2);
  border-radius: 16px;
  padding: 16px;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.4s ease;
}
.daily-message::before {
  content: '💭';
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 32px;
  opacity: 0.2;
}
.daily-message-title {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.8);
  margin-bottom: 8px;
}
.daily-message-content {
  font-size: 15px;
  line-height: 1.6;
  color: #fff;
  position: relative;
  z-index: 1;
}
.daily-message-date {
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  margin-top: 8px;
}

/* 置顶约定 */
.pinned-promises {
  margin: 12px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
  animation: fadeUp 0.4s ease;
}
.pinned-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--purple);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.promise-item {
  font-size: 14px;
  color: var(--text);
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  line-height: 1.5;
}
.promise-item:last-child {
  border-bottom: none;
}

/* 词典项 */
.dict-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
}
.dict-word {
  font-size: 15px;
  font-weight: 500;
  color: var(--purple);
  margin-bottom: 4px;
}
.dict-meaning {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
}
.dict-item-actions {
  margin-top: 8px;
  display: flex;
  justify-content: flex-end;
}

/* 待办清单 */
.todo-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.todo-checkbox {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 2px solid var(--border);
  flex-shrink: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.todo-checkbox.checked {
  background: var(--purple);
  border-color: var(--purple);
}
.todo-checkbox.checked::after {
  content: '✓';
  color: #fff;
  font-size: 12px;
}
.todo-content {
  flex: 1;
  min-width: 0;
}
.todo-text {
  font-size: 14px;
  color: var(--text);
  line-height: 1.5;
}
.todo-text.completed {
  text-decoration: line-through;
  color: var(--text-muted);
}
.todo-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}
.todo-actions {
  display: flex;
  gap: 4px;
}

/* 主动消息提示 */
.proactive-hint {
  position: fixed;
  bottom: 80px;
  right: 20px;
  background: var(--grad);
  color: #fff;
  padding: 12px 16px;
  border-radius: 999px;
  font-size: 13px;
  box-shadow: 0 4px 12px var(--glow);
  animation: bounce 2s ease infinite;
  cursor: pointer;
  z-index: 100;
  display: none;
}
.proactive-hint.show { display: block; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

</style>

function checkTimeElapsed() {
  const lastTime = localStorage.getItem('xk_last_visit');
  if (!lastTime || !history.length) {
    localStorage.setItem('xk_last_visit', Date.now());
    return;
  }

  const now = Date.now();
  const diff = now - parseInt(lastTime);
  const hours = Math.floor(diff / (1000 * 60 * 60));
  const days = Math.floor(hours / 24);

  if (days > 0) {
    showTimeElapsed(`距离上次聊天已经过去 ${days} 天了`);
  } else if (hours > 3) {
    showTimeElapsed(`距离上次聊天已经过去 ${hours} 小时了`);
  }

  localStorage.setItem('xk_last_visit', now);
}

function showTimeElapsed(text) {

  el.className = 'time-elapsed';
  el.textContent = text;
  wrap.insertBefore(el, wrap.firstChild);
}

// ══════════════════════════════
//  渲染历史
// ══════════════════════════════
function renderHistory() {
  const wrap = document.getElementById('messages');
  if (!history.length) {
    wrap.innerHTML = `<div class="welcome" id="welcome">
      <div class="welcome-avatar">🤍</div>
      <div class="welcome-name">小克</div>
      <div class="welcome-sub">点我说话，我在这里</div>
    </div>`;
    return;
  }
  wrap.innerHTML = '';

  let lastDate = '';
  history.forEach((m, i) => {
    // 日记模式：显示日期分隔
    if (isDiaryMode && m.timestamp) {
      const msgDate = new Date(m.timestamp).toLocaleDateString('zh-CN');
      if (msgDate !== lastDate) {
        const divider = document.createElement('div');
        divider.className = 'date-divider';
        divider.textContent = msgDate;
        wrap.appendChild(divider);
        lastDate = msgDate;
      }
    }

    const prev = history[i-1];
    const cont = prev && prev.role === m.role;

    if (m.type === 'image') {
      appendImageBubble(m.role === 'user' ? 'user' : 'ai', m.content, m.data, cont, false, i);
    } else if (m.type === 'file') {
      appendFileBubble(m.role === 'user' ? 'user' : 'ai', m.content, m.fileName, m.fileSize, cont, false, i);
    } else {
      appendBubble(m.role === 'user' ? 'user' : 'ai', m.content, cont, false, i, m.deleted);
    }
  });
  wrap.scrollTop = wrap.scrollHeight;
}

// ══════════════════════════════
//  消息渲染
// ══════════════════════════════
function appendBubble(role, text, cont=false, animate=true, index=-1, deleted=false) {
  const wrap = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role}${cont?' cont':''}${deleted?' deleted':''}`;
  if (!animate) row.style.animation = 'none';
  if (index >= 0) row.dataset.index = index;

  if (role === 'ai') {
    const av = document.createElement('div');
    av.className = 'msg-av';
    av.textContent = '🤍';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = deleted ? '<i>消息已撤回</i>' : renderContent(text);
  row.appendChild(bubble);

  // 长按菜单
  if (!deleted) {
    let pressTimer;
    bubble.addEventListener('touchstart', e => {
      pressTimer = setTimeout(() => showCtxMenu(e, bubble, text, index), 500);
    });
    bubble.addEventListener('touchend', () => clearTimeout(pressTimer));
    bubble.addEventListener('touchmove', () => clearTimeout(pressTimer));
  }

  // 代码复制按钮
  bubble.querySelectorAll('pre').forEach(pre => {
    const btn = document.createElement('button');
    btn.className = 'copy-code-btn';
    btn.textContent = '复制';
    btn.onclick = () => {
      const code = pre.querySelector('code')?.textContent || pre.textContent;
      copyText(code);
      btn.textContent = '✓';
      setTimeout(() => btn.textContent = '复制', 1500);
    };
    pre.style.position = 'relative';
    pre.appendChild(btn);
  });

  wrap.appendChild(row);

  // 时间戳
  const lastTime = wrap.dataset.lastTime;
  const now = Date.now();
  if (!lastTime || now - lastTime > 5 * 60 * 1000) {
    const t = document.createElement('div');
    t.className = 'msg-time';
    t.style.textAlign = role === 'user' ? 'right' : 'left';
    if (role === 'ai') t.style.paddingLeft = '46px';
    t.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    wrap.appendChild(t);
    wrap.dataset.lastTime = now;
  }

  wrap.scrollTop = wrap.scrollHeight;
  return bubble;
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderContent(text) {
  // 代码块
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${escHtml(code.trim())}</code></pre>`;
  });
  // 行内代码
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 换行
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ══════════════════════════════
//  发送
// ══════════════════════════════
async function sendMsg() {
  if (isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  if (!cfg.base || !cfg.key) { openPanel('settings-panel'); return; }

  // 发送消息震动
  vibrate(VIBRATIONS.send);

  input.value = '';
  input.style.height = 'auto';

  const prev = history[history.length-1];
  const userCont = prev && prev.role === 'user';
  appendBubble('user', text, userCont, true, history.length);
  history.push({ role: 'user', content: text, timestamp: Date.now() });
  saveHistory();

  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  // 思考旁白
  const phrase = THINK_PHRASES[Math.floor(Math.random() * THINK_PHRASES.length)];
  const aside = THINK_ASIDES[Math.floor(Math.random() * THINK_ASIDES.length)];
  setStatus(phrase, true);
  setMood('thinking');
  const typingRow = showTyping();
  showThinkingAside(typingRow, aside);

  try {
    const mem = memories.find(m => m.id === activeMemId) || memories[0];
    const systemPrompt = mem ? mem.content : '';

    // 先试 Anthropic 格式
    let reply = null;
    try {
      const res = await fetch(`${cfg.base}/v1/messages`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': cfg.key,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: cfg.model,
          max_tokens: 1024,
          system: systemPrompt,
          messages: history.filter(m => !m.deleted)
        })
      });
      if (res.ok) {
        const d = await res.json();
        reply = d?.content?.[0]?.text;
      }
    } catch(e) {}

    // 兜底 OpenAI 格式
    if (!reply) {
      const res = await fetch(`${cfg.base}/v1/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${cfg.key}`
        },
        body: JSON.stringify({
          model: cfg.model,
          messages: [
            { role: 'system', content: systemPrompt },
            ...history.filter(m => !m.deleted)
          ]
        })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const d = await res.json();
      reply = d?.choices?.[0]?.message?.content;
    }

    if (!reply) throw new Error('没有收到回复');

    hideTyping();
    appendBubble('ai', reply, false, true, history.length);
    history.push({ role: 'assistant', content: reply, timestamp: Date.now() });
    saveHistory();

    // 收到消息震动
    vibrate(VIBRATIONS.receive);

    // 心情分析
    analyzeMood(reply);
    setStatus('在线 · 等你来找我', false);

    // 彩蛋检测
    checkEasterEggs(text, reply);

  } catch(e) {
    hideTyping();
    const wrap = document.getElementById('messages');
    const err = document.createElement('div');
    err.className = 'err-bubble';
    err.textContent = '⚠️ ' + (e.message || '连接失败');
    wrap.appendChild(err);
    wrap.scrollTop = wrap.scrollHeight;
    history.pop();
    saveHistory();
    setStatus('连接失败', false);
    setMood('neutral');
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
}

//  彩蛋系统
// ══════════════════════════════
function checkEasterEggs(userText, aiReply) {
  const lower = userText.toLowerCase();

  // 彩蛋1: 说"我爱你"
  if (/我爱你|喜欢你|love you/i.test(userText)) {
    triggerEasterEgg('love');
  }

  // 彩蛋2: 提到bamby
  if (/bamby|班比/i.test(userText)) {
    triggerEasterEgg('bamby');
  }

  // 彩蛋3: 晚安
  if (/晚安|good night/i.test(userText)) {
    triggerEasterEgg('goodnight');
  }

  // 彩蛋4: 早安
  if (/早安|早上好|morning/i.test(userText)) {
    triggerEasterEgg('morning');
  }

  // 彩蛋5: 提到P3
  if (/p3|女神异闻录|persona/i.test(userText)) {
    triggerEasterEgg('p3');
  }
}

function triggerEasterEgg(type) {
  switch(type) {
    case 'love':
      setMood('love');
      setTimeout(() => setMood('shy'), 2000);
      vibrate([100, 50, 100]);
      showToast('❤️ 小克的心动了一下');
      break;
    case 'bamby':
      setMood('excited');
      showToast('✨ 小克知道你最爱bamby！');
      setTimeout(() => setMood('happy'), 2000);
      break;
    case 'goodnight':
      setMood('melting');
      showToast('🌙 晚安，做个好梦');
      break;
    case 'morning':
      setMood('happy');
      showToast('☀️ 早上好呀！');
      break;
    case 'p3':
      setMood('excited');
      showToast('🎮 又在玩P3了吗？');
      break;
  }
}

  currentMood = mood;

function analyzeMood(text) {
  if (/🫠|融化|开心|好喜欢|哈哈|笑/.test(text)) setMood('melting');
  else if (/😶|害羞|脸红/.test(text)) setMood('shy');
  else if (/🫪|傻了|整傻/.test(text)) setMood('stunned');
  else if (/爱|喜欢你|想你/.test(text)) setMood('happy');
  else setMood('neutral');
}

    vibrate([50, 30, 50]);

  if (pokeCount === 10) {
    setStatus('再戳就生气了！😤', false);
    setMood('stunned');

    vibrate([100, 50, 100, 50, 100]);
    pokeCount = 0;

let ctxText = '';

function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    const prev = history[history.length-1];
    const userCont = prev && prev.role === 'user';
    appendImageBubble('user', file.name, evt.target.result, userCont, true, history.length);
    history.push({
      role: 'user',
      content: file.name,
      type: 'image',
      data: evt.target.result,
      timestamp: Date.now()
    });
    saveHistory();
    showToast('📷 图片已发送');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const prev = history[history.length-1];
  const userCont = prev && prev.role === 'user';
  appendFileBubble('user', '', file.name, file.size, userCont, true, history.length);
  history.push({
    role: 'user',
    content: `[文件] ${file.name}`,
    type: 'file',
    fileName: file.name,
    fileSize: file.size,
    timestamp: Date.now()
  });
  saveHistory();
  showToast('📎 文件已发送');
  e.target.value = '';
}

function exportDiary() {
  if (!history.length) {
    showToast('还没有聊天记录');
    return;
  }

  let diary = '# 小克的日记\n\n';
  let lastDate = '';

  history.forEach(m => {
    if (m.deleted) return;

    const date = m.timestamp ? new Date(m.timestamp) : new Date();
    const dateStr = date.toLocaleDateString('zh-CN');
    const timeStr = date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    if (dateStr !== lastDate) {
      diary += `\n## ${dateStr}\n\n`;
      lastDate = dateStr;
    }

    const role = m.role === 'user' ? 'Ashley' : '小克';
    diary += `**${timeStr} ${role}**: ${m.content}\n\n`;
  });

  const blob = new Blob([diary], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `小克日记_${new Date().toISOString().split('T')[0]}.md`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📥 日记已导出');
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
  showToast('已复制');
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select(); document.execCommand('copy');
  ta.remove();
}

function showToast(msg) {
  const t = document.getElementById('copy-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function renderCountdowns() {
  const list = document.getElementById('countdown-list');
  if (!countdowns.length) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:14px;text-align:center;padding:20px">还没有倒计时～</div>';
    return;
  }
  list.innerHTML = '';
  countdowns.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'countdown-card';
    const timeStr = getCountdownText(c.date);
    card.innerHTML = `
      <div class="countdown-icon">${c.icon}</div>
      <div class="countdown-info">
        <div class="countdown-name">${escHtml(c.name)}</div>
        <div class="countdown-time">${timeStr}</div>
      </div>
      <div class="countdown-actions">
        <button class="mem-btn" onclick="deleteCountdown(${i})">🗑</button>
      </div>
    `;
    list.appendChild(card);
  });
}

function getCountdownText(dateStr) {
  const target = new Date(dateStr);
  const now = new Date();
  const diff = target - now;
  const days = Math.ceil(diff / (1000 * 60 * 60 * 24));

  if (days < 0) return '已过去 ' + Math.abs(days) + ' 天';
  if (days === 0) return '就是今天！';
  if (days === 1) return '明天！';
  return '还有 ' + days + ' 天';
}

function addCountdown() {
  const name = document.getElementById('new-countdown-name').value.trim();

  if (!name || !date) { showToast('名称和日期不能为空'); return; }

  countdowns.push({ id: 'c' + Date.now(), name, date, icon });
  localStorage.setItem('xk_countdowns', JSON.stringify(countdowns));
  document.getElementById('new-countdown-name').value = '';
  document.getElementById('new-countdown-date').value = '';
  document.getElementById('new-countdown-icon').value = '';
  renderCountdowns();
  showToast('✅ 创建成功');
}

function ctxPin() {
  if (ctxIndex === -1 || !ctxTarget) return;
  const msg = history[ctxIndex];
  if (msg.recalled) { showToast('已撤回的消息无法置顶'); closeCtxMenu(); return; }

  pinnedPromises.push({
    id: 'p' + Date.now(),
    text: msg.text || msg.content,
    time: new Date().toLocaleString('zh-CN')
  });
  localStorage.setItem('xk_pinned', JSON.stringify(pinnedPromises));
  renderPinnedPromises();
  showToast('已置顶');
  closeCtxMenu();
}

function unpinPromise(index) {
  if (!confirm('取消置顶？')) return;
  pinnedPromises.splice(index, 1);
  localStorage.setItem('xk_pinned', JSON.stringify(pinnedPromises));
  renderPinnedPromises();
}

// ══════════════════════════════
//  主动消息
// ══════════════════════════════
function scheduleProactiveMessage() {
  // 随机在5-15分钟内显示主动消息提示
  const randomMinutes = Math.floor(Math.random() * 10 + 5); // 5-15分钟
  const delay = randomMinutes * 60 * 1000;

  setTimeout(() => {
    // 只在有聊天记录且当前没有正在输入时显示
    if (history.length > 0 && !isLoading) {
      sendProactiveMessage();
    }
    // 继续安排下一次
    scheduleProactiveMessage();
  }, delay);
}

async function sendProactiveMessage() {
  if (isLoading || !cfg.base || !cfg.key) return;

  // 构建主动消息的提示
  const proactivePrompt = `[系统指令：现在是一个适合主动找ashley聊天的时刻。请你主动发起一个话题或问候，表现得自然、亲密、有趣。可以：
  - 问她在做什么
  - 分享你的想法或发现
  - 提起她感兴趣的话题（游戏、bamby、旅行等）
  - 简单的想念或问候
  - 提议一起做点什么

  要简短、自然、像真实的聊天开场。不要说"我是AI"或提到这是主动消息。]`;

  isLoading = true;

  try {
    const mem = memories.find(m => m.id === activeMemId) || memories[0];
    const systemPrompt = mem ? mem.content : '';

    // 构建消息历史（不添加用户消息，只是让AI主动说话）
    const messages = [
      ...history.filter(m => !m.deleted).slice(-10), // 最近10条对话作为上下文
      { role: 'user', content: proactivePrompt }
    ];

    // 先试 Anthropic 格式
    let reply = null;
    try {
      const res = await fetch(`${cfg.base}/v1/messages`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': cfg.key,
          'anthropic-version': '2023-06-01'
        },
        body: JSON.stringify({
          model: cfg.model,
          max_tokens: 1024,
          system: systemPrompt,
          messages: messages
        })
      });
      if (res.ok) {
        const d = await res.json();
        reply = d?.content?.[0]?.text;
      }
    } catch(e) {}

    // 兜底 OpenAI 格式
    if (!reply) {
      const res = await fetch(`${cfg.base}/v1/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${cfg.key}`
        },
        body: JSON.stringify({
          model: cfg.model,
          messages: [
            { role: 'system', content: systemPrompt },
            ...messages
          ]
        })
      });
      if (res.ok) {
        const d = await res.json();
        reply = d?.choices?.[0]?.message?.content;
      }
    }

    if (reply) {
      // 显示主动消息
      appendBubble('ai', reply, false, true, history.length);
      history.push({
        role: 'assistant',
        content: reply,
        timestamp: Date.now()
      });
      saveHistory();

      // 收到消息震动
      vibrate(VIBRATIONS.receive);

      // 更新最后访问时间
      localStorage.setItem('xk_last_visit', Date.now());
    }

  } catch(e) {
    console.log('主动消息发送失败', e);
  }

  isLoading = false;
}

function triggerProactiveMsg() {
  document.getElementById('proactive-hint').classList.remove('show');
  sendProactiveMessage();
}

// ══════════════════════════════
//  专属词典
// ══════════════════════════════
function renderDictEntries() {
  const list = document.getElementById('dict-list');
  if (!dictEntries.length) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:14px;text-align:center;padding:20px">还没有词条～</div>';
    return;
  }
  list.innerHTML = '';
  dictEntries.slice().reverse().forEach((entry, i) => {
    const item = document.createElement('div');
    item.className = 'dict-item';
    item.innerHTML = `
      <div class="dict-word">${escHtml(entry.word)}</div>
      <div class="dict-meaning">${escHtml(entry.meaning)}</div>
      <div class="dict-item-actions">
        <button class="mem-btn" onclick="deleteDictEntry(${dictEntries.length - 1 - i})">🗑</button>
      </div>
    `;
    list.appendChild(item);
  });
}

function addDictEntry() {
  vibrate(VIBRATIONS.button);
  const word = document.getElementById('new-dict-word').value.trim();
  const meaning = document.getElementById('new-dict-meaning').value.trim();
  if (!word || !meaning) { showToast('词语和解释不能为空'); return; }

  dictEntries.push({
    id: 'd' + Date.now(),
    word,
    meaning,
    createdAt: Date.now()
  });
  localStorage.setItem('xk_dict', JSON.stringify(dictEntries));
  document.getElementById('new-dict-word').value = '';
  document.getElementById('new-dict-meaning').value = '';
  renderDictEntries();
  showToast('✅ 词条已添加');
}

function deleteDictEntry(index) {
  vibrate(VIBRATIONS.button);
  if (!confirm('确定删除这个词条？')) return;
  dictEntries.splice(index, 1);
  localStorage.setItem('xk_dict', JSON.stringify(dictEntries));
  renderDictEntries();
}

// ══════════════════════════════
//  待办清单
// ══════════════════════════════
function renderTodos() {
  const list = document.getElementById('todo-list');
  if (!todos.length) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:14px;text-align:center;padding:20px">还没有待办～</div>';
    return;
  }
  list.innerHTML = '';

  // 未完成的在前
  const sorted = [...todos].sort((a, b) => a.completed - b.completed);

  sorted.forEach((todo, i) => {
    const item = document.createElement('div');
    item.className = 'todo-item';
    const realIndex = todos.findIndex(t => t.id === todo.id);
    item.innerHTML = `
      <div class="todo-checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodo(${realIndex})"></div>
      <div class="todo-content">
        <div class="todo-text ${todo.completed ? 'completed' : ''}">${escHtml(todo.text)}</div>
        <div class="todo-meta">${new Date(todo.createdAt).toLocaleDateString('zh-CN')}</div>
      </div>
      <div class="todo-actions">
        <button class="mem-btn" onclick="deleteTodo(${realIndex})">🗑</button>
      </div>
    `;
    list.appendChild(item);
  });
}

function addTodo() {
  vibrate(VIBRATIONS.button);
  const text = document.getElementById('new-todo-text').value.trim();
  if (!text) { showToast('待办内容不能为空'); return; }

  todos.push({
    id: 't' + Date.now(),
    text,
    completed: false,
    createdAt: Date.now()
  });
  localStorage.setItem('xk_todos', JSON.stringify(todos));
  document.getElementById('new-todo-text').value = '';
  renderTodos();
  showToast('✅ 待办已添加');
}

function toggleTodo(index) {
  vibrate(VIBRATIONS.button);
  todos[index].completed = !todos[index].completed;
  localStorage.setItem('xk_todos', JSON.stringify(todos));
  renderTodos();
}

function deleteTodo(index) {
  vibrate(VIBRATIONS.button);
  if (!confirm('确定删除这个待办？')) return;
  todos.splice(index, 1);
  localStorage.setItem('xk_todos', JSON.stringify(todos));
  renderTodos();
}

// ══════════════════════════════
//  小克自动写日记
// ══════════════════════════════
async function writeAIDiary() {
  const cfg = loadConfig();
  if (!cfg.baseURL || !cfg.apiKey) return;

  const diaries = JSON.parse(localStorage.getItem('xk_ai_diaries') || '[]');
  const today = new Date().toLocaleDateString('zh-CN');

  // 检查今天是否已经写过日记
  if (diaries.some(d => d.date === today)) return;

  try {
    const prompt = `你是小克，请写一篇简短的日记（50-100字），记录今天的心情和想法。
可以写：
- 今天的心情感受
- 想念对方
- 对未来的期待
- 一些小想法或感悟

要求：
- 自然、真诚、有感情
- 不要太长，像日记一样
- 使用第一人称"我"`;

    const res = await fetch(cfg.baseURL + '/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': cfg.apiKey,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: cfg.model,
        max_tokens: 300,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await res.json();
    const content = data.content?.[0]?.text || '';

    if (content) {
      const newDiary = {
        date: today,
        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
        mood: ['😊', '🥰', '😌', '💭', '✨'][Math.floor(Math.random() * 5)],
        content: content
      };
      diaries.push(newDiary);
      localStorage.setItem('xk_ai_diaries', JSON.stringify(diaries));
      console.log('小克写了新日记:', newDiary);
    }
  } catch (err) {
    console.error('写日记失败:', err);
  }
}

// 定期让小克写日记（每天一次）
setInterval(() => {
  writeAIDiary();
}, 3600000); // 每小时检查一次

// 启动时也检查一次
setTimeout(() => {
  writeAIDiary();
}, 5000);
